# Sürüm yayınlama: "v1.2.3" etiketi gönderilince Windows kurulumunu ve Mac paketlerini
# derleyip GitHub Releases'a yükler. Uygulamalar güncellemeleri buradan alır.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # Yayını bir kez oluştur; derlemeler aynı anda yayın açmaya çalışıp çift kayıt üretmesin
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Yayını oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "SureBrowser ${TAG#v}" --notes "SureBrowser ${TAG#v}"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Windows'ta da bash: PowerShell "-c.publish.owner=..." gibi argümanları bozuyor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - name: Derle ve yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: >
          npx electron-builder ${{ matrix.target }} --publish always
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}

  # Android APK (Samsung Galaxy Z Fold ve diğer Android cihazlar)
  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: İmza anahtarı
        env:
          KS: ${{ secrets.SB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::SB_KEYSTORE_BASE64 tanımlı değil, APK atlandı"; echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          echo "$KS" | base64 -d > $RUNNER_TEMP/release.jks
          echo "SB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: APK derle ve yayınla
        if: env.SKIP != '1'
        working-directory: android
        env:
          SB_KEYSTORE_PASSWORD: ${{ secrets.SB_KEYSTORE_PASSWORD }}
          SB_KEY_ALIAS: surebrowser
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "SureBrowser-${TAG#v}.apk"
          gh release upload "$TAG" "SureBrowser-${TAG#v}.apk" --clobber --repo "${{ github.repository }}"
